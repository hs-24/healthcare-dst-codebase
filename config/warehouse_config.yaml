simulation:
  name: Healthcare Warehouse PoC - Site A Pilot
  duration_days: 30
  random_seed: 42
  time_step_hours: 24
sites:
- site_id: SITE_A
  site_name: Central Distribution Hub
  description: Pilot site selected for PoC due to highest spreadsheet volume.
    Representative of the multi-site, multi-category catalogue described in
    Section 1 (PPE/consumables, pharmaceuticals, cold-chain, diagnostics,
    equipment consumables) rather than a single-category store.
# SKU catalogue is illustrative/mock data, sized and parameterised to be
# representative of a real hospital central distribution hub (typical
# consumption volumes, ABC/XYZ mix, and lead times drawn from public WHO/NHS
# essential-medicines and hospital-logistics guidance) -- not derived from
# any live production system, consistent with the pilot's agreed scope.
#
# storage_mode reflects the physical storage zone each SKU is racked in at
# a real large-scale healthcare DC:
#   VNA          - Very Narrow Aisle high-bay pallet racking (bulk A/B-class
#                  consumables and pharmaceuticals, reach/turret-truck served)
#   COLD_VAULT   - Very Narrow Vault: a refrigerated 2-8°C narrow-aisle cage
#                  for cold-chain pharmaceuticals (vaccines, insulin)
#   SECURE_CAGE  - caged, access-controlled bay for low-volume, clinically
#                  critical equipment consumables
#
# units_per_pallet is the physical pallet build quantity used to convert
# stock units into pallet counts for the 3D twin and floor operations.
skus:
# --- PPE / general consumables (highest volume, A-class, VNA racking) ---
- sku_id: MED-001
