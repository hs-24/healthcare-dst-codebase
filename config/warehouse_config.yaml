simulation:
  name: Healthcare Supply Network Twin - Three-Site Pilot
  duration_days: 30
  random_seed: 42
  time_step_hours: 24

data_source:
  name: Hospital Supply Chain
  provider: Kaggle user vanpatangan
  url: https://www.kaggle.com/datasets/vanpatangan/hospital-supply-chain
  inventory_file: data/raw/hospital-supply-chain/inventory_data.csv
  normalized_file: data/processed/hospital_inventory_normalized.csv

# The source has no site, UOM, storage-zone, batch, or expiry fields.
# hospital_data.py derives them deterministically and records their provenance.
sites:
  - site_id: SITE_A
    site_name: Central Distribution Hub
  - site_id: SITE_B
    site_name: North Regional Hub
  - site_id: SITE_C
    site_name: East Satellite Depot

data_quality:
  duplicate_entry_rate: 0.05
  missing_entry_rate: 0.04
  manual_entry_error_rate: 0.06
  reporting_lag_days: 1
